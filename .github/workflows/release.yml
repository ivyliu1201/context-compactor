name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  source-release:
    name: Verify Python source and draft release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run Python tests
        run: python -B -m unittest discover -s tests

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -LiteralPath scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failures += "$($_.Name): $($errors -join '; ')"
            }
          }
          if ($failures.Count -gt 0) {
            throw ($failures -join [Environment]::NewLine)
          }

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            "release",
            "create",
            $env:GITHUB_REF_NAME,
            "--draft",
            "--generate-notes",
            "--title",
            "context-compactor $env:GITHUB_REF_NAME",
            "--verify-tag"
          )
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE."
          }
