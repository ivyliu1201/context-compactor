name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows-amd64:
    name: Windows amd64
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      GOARCH: amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build Windows executable
        run: go build -trimpath -ldflags="-s -w" -o context-compactor-windows-amd64.exe ./cmd/context-compactor
