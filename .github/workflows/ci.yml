name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  windows-python:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python syntax
        run: >-
          python -B -c "import ast,pathlib;
          roots=('context_compactor','scripts','tests');
          files=[path for root in roots for path in pathlib.Path(root).rglob('*.py')];
          [ast.parse(path.read_text(encoding='utf-8'),filename=str(path)) for path in files];
          print(f'parsed {len(files)} Python files')"

      - name: Run Python tests
        run: python -B -m unittest discover -s tests

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -LiteralPath scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failures += "$($_.Name): $($errors -join '; ')"
            }
          }
          if ($failures.Count -gt 0) {
            throw ($failures -join [Environment]::NewLine)
          }
